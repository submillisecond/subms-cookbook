name: ci

on:
  push:
    branches: [main]
  pull_request:

# Per-recipe matrix - changing one recipe only spends CI on that recipe + any
# that depend on it. Primer jobs run their own matrix (Java-only). The CLI is
# a small npm test target.
#
# Path filters keep PR runtimes sane: a doc-only change under content/ skips
# the language matrices entirely.

permissions:
  contents: read

jobs:
  changes:
    name: detect changed paths
    runs-on: ubuntu-latest
    outputs:
      recipes: ${{ steps.filter.outputs.recipes }}
      primers:  ${{ steps.filter.outputs.primers }}
      cli:     ${{ steps.filter.outputs.cli }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            recipes:
              - 'recipes/**'
            primers:
              - 'primers/**'
            cli:
              - 'cli/**'

  rust:
    name: rust (${{ matrix.recipe }})
    needs: changes
    if: needs.changes.outputs.recipes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - subms-adaptive-radix-tree
          - subms-arena-allocator
          - subms-block-cache
          - subms-bloom-filter
          - subms-count-min-sketch
          - subms-cuckoo-filter
          - subms-hdr-histogram
          - subms-hyperloglog
          - subms-lsm-tree
          - subms-merge-iterator
          - subms-mpsc-queue
          - subms-rate-limiter
          - subms-segment-reader
          - subms-spsc-ring-buffer
          - subms-timer-wheel
          - subms-treap
    defaults:
      run:
        working-directory: recipes/${{ matrix.recipe }}/rust
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            recipes/${{ matrix.recipe }}/rust/target
          key: ${{ runner.os }}-cargo-${{ matrix.recipe }}-${{ hashFiles(format('recipes/{0}/rust/Cargo.toml', matrix.recipe)) }}

      # `shell: bash` runs with `-o pipefail`, so cargo's exit status survives
      # the pipe into tee. The default shell does not, and the step would go
      # green on a red test run. Every gate is continue-on-error so the summary
      # step still runs; the summary action is what fails the job.
      - name: cargo test (no features)
        id: test_nodefault
        continue-on-error: true
        shell: bash
        run: cargo test --no-default-features 2>&1 | tee "$GITHUB_WORKSPACE/ci-rust-nodefault.log"

      # The harness-gated `tests/sub_millisecond_bench.rs` asserts p99 < 1 ms
      # on the canonical workload. Those assertions require optimised codegen
      # to land - debug builds are 50-100x slower per op and would never hit
      # the budget. Compile cost is higher, but the actual bench runs in
      # seconds in release vs minutes in debug.
      - name: cargo test (harness, release)
        id: test_harness
        continue-on-error: true
        shell: bash
        run: cargo test --release --features harness 2>&1 | tee "$GITHUB_WORKSPACE/ci-rust-harness.log"

      - name: cargo fmt
        id: fmt
        continue-on-error: true
        run: cargo fmt --check

      - name: cargo clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Library-code line coverage gate. Runs on Linux only (tarpaulin is broken
      # on Windows aarch64). DEBUG build (no --release): release-optimised codegen
      # breaks tarpaulin's line attribution (executed lines report uncovered). The
      # `full` feature enables every std-only capability module (src/features/**)
      # so it IS counted - NOT the harness (recipe.rs/bench/perf_main) or external
      # adapter deps. `--lib` runs the colocated unit tests only, skipping the
      # tests/ harness bench (measured separately in release above).
      - name: install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: cargo tarpaulin (>= 90% line coverage)
        id: tarpaulin
        continue-on-error: true
        env:
          RECIPE: ${{ matrix.recipe }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/rust-coverage.sh"

      - name: Run summary
        if: always()
        uses: submillisecond/subms-actions/scripts/ci-summary@main
        with:
          title: "${{ matrix.recipe }} - Rust"
          gates: |
            cargo test --no-default-features=${{ steps.test_nodefault.outcome }}
            cargo test --release --features harness=${{ steps.test_harness.outcome }}
            cargo fmt --check=${{ steps.fmt.outcome }}
            cargo clippy -D warnings=${{ steps.clippy.outcome }}
            cargo tarpaulin (>= 90%)=${{ steps.tarpaulin.outcome }}
          cargo-test-logs: |
            no-default-features=ci-rust-nodefault.log
            harness (release)=ci-rust-harness.log
          tarpaulin: |
            ${{ matrix.recipe }} (tarpaulin)=recipes/${{ matrix.recipe }}/rust/cobertura.xml
          coverage-min: "0.90"
          notes: |
            - The harness run compiles in release; `sub_millisecond_bench` asserts p99 < 1 ms and would never hit the budget in a debug build.
            - lib, integration and doc counts stay separate - cargo runs them as separate binaries and summing them hides which one broke.

      - name: upload rust coverage summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cisum-rust-${{ matrix.recipe }}
          path: ${{ runner.temp }}/cisum/rust-${{ matrix.recipe }}.txt
          if-no-files-found: ignore

  java-recipe:
    name: java (${{ matrix.recipe }})
    needs: changes
    if: needs.changes.outputs.recipes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - subms-adaptive-radix-tree
          - subms-arena-allocator
          - subms-block-cache
          - subms-bloom-filter
          - subms-count-min-sketch
          - subms-cuckoo-filter
          - subms-hdr-histogram
          - subms-hyperloglog
          - subms-lsm-tree
          - subms-merge-iterator
          - subms-mpsc-queue
          - subms-rate-limiter
          - subms-segment-reader
          - subms-spsc-ring-buffer
          - subms-timer-wheel
          - subms-treap
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Pre-install cross-recipe deps to ~/.m2 before the matrix entry's
      # verify. Currently the only such dep is subms-lsm-tree -> subms-bloom-filter
      # (lsm uses the bloom for SSTable trailers). Add more conditional steps
      # here if future recipes pick up sibling deps.
      - name: Install upstream recipe deps (subms-lsm-tree -> subms-bloom-filter)
        if: matrix.recipe == 'subms-lsm-tree'
        working-directory: recipes/subms-bloom-filter/java
        run: mvn -B -q -DskipTests install

      # maven.test.failure.ignore lets `verify` reach jacoco when a test fails,
      # so a red run still reports its coverage number. Failing tests are
      # counted from the surefire XML by the summary step, which fails the job.
      - name: mvn verify
        id: verify
        continue-on-error: true
        working-directory: recipes/${{ matrix.recipe }}/java
        run: mvn -B -q verify -Dmaven.test.failure.ignore=true

      - name: capture java coverage summary
        if: always()
        working-directory: recipes/${{ matrix.recipe }}/java
        env:
          RECIPE: ${{ matrix.recipe }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/java-coverage.sh"

      - name: Run summary
        if: always()
        uses: submillisecond/subms-actions/scripts/ci-summary@main
        with:
          title: "${{ matrix.recipe }} - Java"
          gates: |
            mvn verify (compile + jacoco check)=${{ steps.verify.outcome }}
          surefire-dirs: |
            ${{ matrix.recipe }}=recipes/${{ matrix.recipe }}/java/target/surefire-reports
          jacoco-xml: |
            ${{ matrix.recipe }} (jacoco)=recipes/${{ matrix.recipe }}/java/target/site/jacoco/jacoco.xml
          coverage-min: "0.90"
          notes: |
            - Counts and failure messages come from `target/surefire-reports/*.xml`, not mvn stdout, so `-q` does not hide them.

      - name: upload java coverage summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cisum-java-${{ matrix.recipe }}
          path: ${{ runner.temp }}/cisum/java-${{ matrix.recipe }}.txt
          if-no-files-found: ignore

  java-primer:
    name: java primer (${{ matrix.primer }})
    needs: changes
    if: needs.changes.outputs.primers == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        primer:
          - subms-java21-virtual-threads
          - subms-zgc
          - subms-spring-boot-virtual-threads
    defaults:
      run:
        working-directory: primers/java/${{ matrix.primer }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn verify
        run: mvn -B -q verify

  cli:
    name: cli (pnpm test)
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          # `cache: pnpm` is intentionally omitted - it requires a committed
          # pnpm-lock.yaml. Add it back once we commit one. The pnpm action
          # itself caches the store, so this isn't a net loss.
      - name: pnpm install
        # Drop --no-frozen-lockfile once a pnpm-lock.yaml is committed.
        run: pnpm install --no-frozen-lockfile
      - name: pnpm test
        run: pnpm test

  summary:
    name: ci summary
    needs: [changes, rust, java-recipe, java-primer, cli]

    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: download recipe coverage summaries
        if: always()
        uses: actions/download-artifact@v8
        with:
          pattern: cisum-*
          path: ${{ runner.temp }}/cisum
          merge-multiple: true
      - name: Write run summary
        env:
          R_RUST:    ${{ needs.rust.result }}
          R_JAVA:    ${{ needs.java-recipe.result }}
          R_PRIMER:  ${{ needs.java-primer.result }}
          R_CLI:     ${{ needs.cli.result }}
          C_RECIPES: ${{ needs.changes.outputs.recipes }}
          C_PRIMERS: ${{ needs.changes.outputs.primers }}
          C_CLI:     ${{ needs.changes.outputs.cli }}
          CISUM_DIR: ${{ runner.temp }}/cisum
        run: bash .github/scripts/ci-summary.sh
