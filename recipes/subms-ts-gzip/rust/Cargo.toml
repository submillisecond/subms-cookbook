[package]
name = "subms-ts-gzip"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <oss@submillisecond.com>"]
description = "submillisecond.com cookbook recipe - timeseries: subms-ts-gzip. Zero-dep hand-rolled DEFLATE/INFLATE gzip codec that wraps any inner TsCodec - gunzip-interoperable, decodes arbitrary gzip/zlib streams."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://www.submillisecond.com/cookbook/recipes/subms-ts-gzip"
repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-ts-gzip"
documentation = "https://www.submillisecond.com/cookbook/recipes/subms-ts-gzip"
keywords = ["gzip", "deflate", "codec", "time-series", "subms"]
categories = ["encoding", "compression", "data-structures"]

[lib]
name = "subms_ts_gzip"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[features]
default = []
harness = ["dep:subms"]

[dependencies]
subms-ts = { version = "0.6.0", path = "../../subms-ts/rust" }
subms = { version = "0.5.2", path = "../../../../subms/rust", optional = true }
