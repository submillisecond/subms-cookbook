[package]
name = "subms-count-min-sketch"
version = "0.9.1"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <oss@submillisecond.com>"]
description = "submillisecond.com cookbook recipe - probabilistic: subms-count-min-sketch. Frequency-estimation sketch with conservative update and Kirsch-Mitzenmacher hashing."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://www.submillisecond.com/cookbook/recipes/subms-count-min-sketch"
documentation = "https://www.submillisecond.com/cookbook/recipes/subms-count-min-sketch"
repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-count-min-sketch"
keywords = ["count-min", "sketch", "frequency", "probabilistic", "subms"]
categories = ["data-structures", "algorithms"]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "subms_count_min_sketch"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[[example]]
name = "perf_features"
required-features = ["harness", "heavy-hitters", "windowed", "merge"]

[features]
default = []

# The bench harness wiring: `Recipe` impl, `perf_main` example, and
# `sub_millisecond_bench` integration test. End users typically leave
# this off.
harness = ["dep:subms"]

# ----- Opt-in feature catalog (subms 0.5+) -----
# Each feature lives in src/features/<name>.rs behind a #[cfg(feature)]
# gate. The base sketch is std-only + zero-dep; pick what you need:
#
#   subms-count-min-sketch = { version = "0.9.1", features = ["heavy-hitters"] }
#   subms-count-min-sketch = { version = "0.9.1", features = ["merge", "windowed"] }
#
# `heavy-hitters` - HeavyHitters: top-K key tracker driven by the
#                   CMS estimates. Bounded-size min-heap, K
#                   configurable. Update on every add().
# `windowed`      - WindowedCountMinSketch: ring of N sub-sketches,
#                   each covering a time slice. tick() rotates the
#                   oldest slice out; estimates aggregate across all.
# `merge`         - Element-wise max-merge of two sketches of identical
#                   shape. Conservative-update is non-associative under
#                   sum, so max is the safe combiner.
heavy-hitters = []
windowed = []
merge = []

# Every std-only capability module, enabled together. This is the set the
# coverage gate measures (`cargo tarpaulin --features full --lib`). Excludes
# `harness` (pulls the external harness dependency).
full = ["heavy-hitters", "windowed", "merge"]

[dependencies]
subms = { version = "0.9.3", optional = true }
