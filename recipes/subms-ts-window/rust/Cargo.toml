[package]
name = "subms-ts-window"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <oss@submillisecond.com>"]
description = "submillisecond.com cookbook recipe - timeseries: subms-ts-window. SQL-style window functions (lag/lead/rank/cumsum/over) partitioned by key over a TsFrame, built on the subms-ts-expr IR. Byte-equivalent to com.submillisecond.recipes:subms-ts-window."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://www.submillisecond.com/cookbook/recipes/subms-ts-window"
repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-ts-window"
documentation = "https://www.submillisecond.com/cookbook/recipes/subms-ts-window"
keywords = ["window-function", "dataframe", "time-series", "partition", "subms"]
categories = ["data-structures", "algorithms"]

[lib]
name = "subms_ts_window"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[features]
default = []
harness = ["dep:subms"]

[dependencies]
subms-ts = { version = "0.6.0", path = "../../subms-ts/rust" }
subms-ts-expr = { version = "0.6.0", path = "../../subms-ts-expr/rust" }
subms = { version = "0.5.2", path = "../../../../subms/rust", optional = true }
