[package]
name = "subms-ts-csv"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <oss@submillisecond.com>"]
description = "submillisecond.com cookbook recipe - timeseries: subms-ts-csv. Zero-dep hand-rolled CSV / NDJSON reader and writer to and from the typed TsDataFrame, with per-column type inference. Byte-equivalent to com.submillisecond.recipes:subms-ts-csv."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://www.submillisecond.com/cookbook/recipes/subms-ts-csv"
repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-ts-csv"
documentation = "https://www.submillisecond.com/cookbook/recipes/subms-ts-csv"
keywords = ["csv", "ndjson", "dataframe", "time-series", "subms"]
categories = ["data-structures", "parser-implementations"]

[lib]
name = "subms_ts_csv"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[features]
default = []
harness = ["dep:subms"]

[dependencies]
subms-ts = { version = "0.6.0", path = "../../subms-ts/rust" }
subms = { version = "0.5.2", path = "../../../../subms/rust", optional = true }
