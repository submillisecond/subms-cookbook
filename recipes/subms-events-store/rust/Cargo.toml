[package]
name = "subms-events-store"
version = "0.9.1"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <oss@submillisecond.com>"]
description = "submillisecond.com cookbook recipe - storage: subms-events-store. In-memory event sourcing on subms-events: append-only log, offsets, full replay + incremental projections, and live subscriptions. Zero-dep, std-only. Byte-equivalent JSON to com.submillisecond.recipes:subms-events-store and the Python sibling."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://www.submillisecond.com/cookbook/recipes/subms-events-store"
repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-events-store"
documentation = "https://www.submillisecond.com/cookbook/recipes/subms-events-store"
keywords = ["event-sourcing", "event-store", "projection", "cqrs", "subms"]
categories = ["data-structures", "database-implementations"]

[lib]
name = "subms_events_store"
path = "src/lib.rs"

[[example]]
name = "demo"

[[example]]
name = "perf_main"
required-features = ["harness"]

[features]
default = []
harness = ["dep:subms"]

# Every std-only capability module, enabled together. This recipe has no
# opt-in capability features, so `full` is empty; it exists so the coverage
# gate (`cargo tarpaulin --features full --lib`) has a stable target.
full = []

[dependencies]
subms-events = { version = "0.9.1", path = "../../subms-events/rust" }
subms = { version = "0.9.2", optional = true }
