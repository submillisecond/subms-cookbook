[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subms-events-store"
version = "0.6.0"
description = "submillisecond.com cookbook recipe - storage: subms-events-store. In-memory event sourcing on subms-events: append-only log, offsets, full replay + incremental projections, and live subscriptions. Zero runtime deps beyond subms-events. Byte-equivalent JSON to the Rust + Java ports."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
authors = [{ name = "Kieran Smith", email = "oss@submillisecond.com" }]
dependencies = ["subms-events>=0.6.0"]
keywords = ["event-sourcing", "event-store", "projection", "cqrs", "subms"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://www.submillisecond.com/cookbook/recipes/subms-events-store"
Repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-events-store"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/subms_events_store"]
