[package]
name = "subms-ts-downsampler"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <oss@submillisecond.com>"]
description = "submillisecond.com cookbook recipe - timeseries: subms-ts-downsampler. Tiered downsampling pipeline (raw -> 1s -> 1m -> 1h) emitting count/sum/min/max/last per bucket. Byte-equivalent to com.submillisecond.recipes:subms-ts-downsampler."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://www.submillisecond.com/cookbook/recipes/subms-ts-downsampler"
repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-ts-downsampler"
documentation = "https://www.submillisecond.com/cookbook/recipes/subms-ts-downsampler"
keywords = ["downsampling", "rollup", "time-series", "tsdb", "subms"]
categories = ["data-structures", "algorithms"]

[lib]
name = "subms_ts_downsampler"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[features]
default = []
harness = ["dep:subms"]

[dependencies]
subms-ts = { version = "0.6.0", path = "../../subms-ts/rust" }
subms = { version = "0.5.2", path = "../../../../subms/rust", optional = true }
