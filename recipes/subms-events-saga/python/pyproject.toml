[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subms-events-saga"
version = "0.6.0"
description = "submillisecond.com cookbook recipe - concurrency: subms-events-saga. In-process compensating-step (saga) executor on subms-events: forward steps with reverse-order rollback on failure, plus step lifecycle events. Zero runtime deps beyond subms-events. Byte-equivalent JSON to the Rust + Java ports."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
authors = [{ name = "Kieran Smith", email = "oss@submillisecond.com" }]
dependencies = ["subms-events>=0.6.0"]
keywords = ["saga", "compensation", "orchestration", "workflow", "subms"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://www.submillisecond.com/cookbook/recipes/subms-events-saga"
Repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-events-saga"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/subms_events_saga"]
