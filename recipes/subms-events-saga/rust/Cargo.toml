[package]
name = "subms-events-saga"
version = "0.8.1"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <oss@submillisecond.com>"]
description = "submillisecond.com cookbook recipe - concurrency: subms-events-saga. In-process compensating-step (saga) executor on subms-events: forward steps with reverse-order rollback on failure, plus step lifecycle events. Zero-dep, std-only. Byte-equivalent JSON to com.submillisecond.recipes:subms-events-saga and the Python sibling."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://www.submillisecond.com/cookbook/recipes/subms-events-saga"
repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-events-saga"
documentation = "https://www.submillisecond.com/cookbook/recipes/subms-events-saga"
keywords = ["saga", "compensation", "orchestration", "workflow", "subms"]
categories = ["concurrency", "rust-patterns"]

[lib]
name = "subms_events_saga"
path = "src/lib.rs"

[[example]]
name = "demo"

[[example]]
name = "perf_main"
required-features = ["harness"]

[features]
default = []
harness = ["dep:subms"]

# Every std-only capability module, enabled together. This recipe has no
# opt-in capability features, so `full` is empty; it exists so the coverage
# gate (`cargo tarpaulin --features full --lib`) has a stable target.
full = []

[dependencies]
subms-events = { version = "0.8.1", path = "../../subms-events/rust" }
subms = { version = "0.8.0", optional = true }

[dev-dependencies]
# Test-only: validates the hand-rolled SagaReport JSON against a real parser.
serde_json = "1"
