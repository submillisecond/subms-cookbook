[package]
name = "subms-ts-adapter-parquet"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <oss@submillisecond.com>"]
description = "submillisecond.com cookbook recipe - timeseries: subms-ts-adapter-parquet. A Parquet adapter - persists TsSeries / TsCollection to Apache Parquet over the subms-ts-adapter-arrow columnar bridge, readable by Spark / DuckDB / pandas. Byte-equivalent to com.submillisecond.recipes:subms-ts-adapter-parquet."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://www.submillisecond.com/cookbook/recipes/subms-ts-adapter-parquet"
repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-ts-adapter-parquet"
documentation = "https://www.submillisecond.com/cookbook/recipes/subms-ts-adapter-parquet"
keywords = ["parquet", "columnar", "time-series", "arrow", "subms"]
categories = ["database", "encoding"]

[lib]
name = "subms_ts_parquet"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[features]
default = []
harness = ["dep:subms"]

[dependencies]
subms-ts = { version = "0.6.0", path = "../../subms-ts/rust" }
subms-ts-adapter-arrow = { version = "0.6.0", path = "../../subms-ts-adapter-arrow/rust" }
arrow = { version = "53", default-features = false }
parquet = { version = "53", default-features = false, features = ["arrow"] }
bytes = "1"
subms = { version = "0.5.2", path = "../../../../subms/rust", optional = true }
