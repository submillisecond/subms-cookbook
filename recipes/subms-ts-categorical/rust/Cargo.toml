[package]
name = "subms-ts-categorical"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <oss@submillisecond.com>"]
description = "submillisecond.com cookbook recipe - timeseries: subms-ts-categorical. A string-interning table and dictionary-encoded string columns that turn expensive string group/join keys into cheap u32 integer compares. Byte-equivalent to com.submillisecond.recipes:subms-ts-categorical."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://www.submillisecond.com/cookbook/recipes/subms-ts-categorical"
repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-ts-categorical"
documentation = "https://www.submillisecond.com/cookbook/recipes/subms-ts-categorical"
keywords = ["dictionary", "interning", "categorical", "time-series", "subms"]
categories = ["data-structures", "algorithms"]

[lib]
name = "subms_ts_categorical"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[features]
default = []
harness = ["dep:subms"]

[dependencies]
subms-ts = { version = "0.6.0", path = "../../subms-ts/rust" }
subms = { version = "0.5.2", path = "../../../../subms/rust", optional = true }
