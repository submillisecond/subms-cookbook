[package]
name = "subms-ts"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <oss@submillisecond.com>"]
description = "submillisecond.com cookbook recipe - timeseries: subms-ts. Generic time-series core (TsPoint / TsSeries) with three-temperature chunked storage, time queries, aggregates, and sub-ms p99 contracts. Byte-equivalent to com.submillisecond.recipes:subms-ts."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://www.submillisecond.com/cookbook/recipes/subms-ts"
repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-ts"
documentation = "https://www.submillisecond.com/cookbook/recipes/subms-ts"
keywords = ["time-series", "tsdb", "ohlc", "latency", "subms"]
categories = ["data-structures", "science"]

[lib]
name = "subms_ts"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[features]
default = []

# Harness wiring: SubMsRecipe impl + perf_main example + bench test.
# End users typically leave this off.
harness = ["dep:subms"]

# DateTime ergonomics over the i64-nanos core. Off by default to keep
# the zero-dep promise; on, it adds chrono conversions (TsPoint::at_datetime,
# point.datetime(), series.range_datetime(...)).
datetime = ["dep:chrono"]

# Vectorised numeric scans. Swaps the scalar min/max/sum/mean folds for
# lane-unrolled kernels over the contiguous value columns - independent
# accumulators give the optimiser the ILP to emit SIMD on stable (no
# nightly std::simd, no dep). Off keeps the existing scalar p99 claims; on,
# f64 sum/mean reorder by lane so they may differ from the scalar result by
# an ULP (no wire format here, so nothing byte-bound).
simd = []

[[example]]
name = "simd_compare"

[dependencies]
subms = { version = "0.5.2", path = "../../../../subms/rust", optional = true }
chrono = { version = "0.4", optional = true, default-features = false, features = ["std"] }
