[package]
name = "subms-ts-resample"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <oss@submillisecond.com>"]
description = "submillisecond.com cookbook recipe - timeseries: subms-ts-resample. Resample an irregular series onto a regular grid (mean / last / first / sum / count / min / max / linear). Byte-equivalent to com.submillisecond.recipes:subms-ts-resample."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://www.submillisecond.com/cookbook/recipes/subms-ts-resample"
repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-ts-resample"
documentation = "https://www.submillisecond.com/cookbook/recipes/subms-ts-resample"
keywords = ["resample", "grid", "downsample", "time-series", "subms"]
categories = ["algorithms", "data-structures"]

[lib]
name = "subms_ts_resample"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[features]
default = []
harness = ["dep:subms"]

[dependencies]
subms-ts = { version = "0.6.0", path = "../../subms-ts/rust" }
subms = { version = "0.5.2", path = "../../../../subms/rust", optional = true }
