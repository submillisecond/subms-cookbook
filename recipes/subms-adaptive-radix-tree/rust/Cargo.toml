[package]
name = "subms-adaptive-radix-tree"
version = "0.5.2"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <oss@submillisecond.com>"]
description = "submillisecond.com cookbook recipe - data-structures: subms-adaptive-radix-tree. ART with Node4 / Node256 adaptive variants on byte-string keys."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://www.submillisecond.com/cookbook/recipes/subms-adaptive-radix-tree"
repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-adaptive-radix-tree"
keywords = ["art", "radix", "trie", "data-structures", "subms"]
categories = ["data-structures"]

[lib]
name = "subms_adaptive_radix_tree"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[[example]]
name = "perf_features"
required-features = ["harness", "serialize", "range-scan", "concurrent-reads", "metrics", "compaction"]

[features]
default = []

# Bench-harness wiring: `Recipe` impl + `perf_main` example.
harness = ["dep:subms"]

# ----- Opt-in feature catalog (subms 0.5+) -----
# Each feature lives in src/features/<name>.rs behind its own gate.
# Base ART stays zero-dep std-only; opt-ins add focused capability:
#
#   subms-adaptive-radix-tree = { version = "0.5", features = ["range-scan"] }
#
# `serialize`        - Custom binary format. Versioned header + node-tagged
#                      stream. Round-trip preserves all insertions.
# `range-scan`       - In-order iterator between byte-lex bounds.
# `concurrent-reads` - Frozen snapshot view readers hold while writers mutate.
# `metrics`          - Per-instance counters: lookups, inserts, deletes,
#                      depth, node-type distribution.
# `compaction`       - Post-delete pass that shrinks Full back to Small.
serialize = []
range-scan = []
concurrent-reads = []
metrics = []
compaction = []

[dependencies]
subms = { version = "0.5.2", path = "../../../../subms/rust", optional = true }
