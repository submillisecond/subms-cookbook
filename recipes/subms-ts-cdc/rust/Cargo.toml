[package]
name = "subms-ts-cdc"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <oss@submillisecond.com>"]
description = "submillisecond.com cookbook recipe - timeseries: subms-ts-cdc. Change-data-capture wrapper over a TsCollection - mirror every mutation to per-subscriber wait-free SPSC rings. Byte-equivalent to com.submillisecond.recipes:subms-ts-cdc."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://www.submillisecond.com/cookbook/recipes/subms-ts-cdc"
repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-ts-cdc"
documentation = "https://www.submillisecond.com/cookbook/recipes/subms-ts-cdc"
keywords = ["cdc", "change-feed", "subscribe", "time-series", "subms"]
categories = ["data-structures", "concurrency"]

[lib]
name = "subms_ts_cdc"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[features]
default = []
harness = ["dep:subms"]

[dependencies]
subms-ts = { version = "0.6.0", path = "../../subms-ts/rust" }
subms-spsc-ring-buffer = { version = "0.5.2", path = "../../subms-spsc-ring-buffer/rust" }
subms = { version = "0.5.2", path = "../../../../subms/rust", optional = true }
