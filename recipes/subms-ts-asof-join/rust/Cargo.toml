[package]
name = "subms-ts-asof-join"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <oss@submillisecond.com>"]
description = "submillisecond.com cookbook recipe - timeseries: subms-ts-asof-join. As-of joins (backward / forward / nearest-within-tolerance) over two time series via a single merge-walk. Byte-equivalent to com.submillisecond.recipes:subms-ts-asof-join."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://www.submillisecond.com/cookbook/recipes/subms-ts-asof-join"
repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-ts-asof-join"
documentation = "https://www.submillisecond.com/cookbook/recipes/subms-ts-asof-join"
keywords = ["asof-join", "join", "time-series", "tsdb", "subms"]
categories = ["algorithms", "data-structures"]

[lib]
name = "subms_ts_asof_join"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[features]
default = []
harness = ["dep:subms"]

[dependencies]
subms-ts = { version = "0.6.0", path = "../../subms-ts/rust" }
subms = { version = "0.5.2", path = "../../../../subms/rust", optional = true }
