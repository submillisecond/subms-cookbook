[package]
name = "subms-tdigest"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <oss@submillisecond.com>"]
description = "submillisecond.com cookbook recipe - timeseries: subms-tdigest. Streaming quantile sketch (t-digest, merging variant + k1 scale): constant memory, mergeable, relative-error bounded. Byte-equivalent to com.submillisecond.recipes:subms-tdigest."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://www.submillisecond.com/cookbook/recipes/subms-tdigest"
repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-tdigest"
documentation = "https://www.submillisecond.com/cookbook/recipes/subms-tdigest"
keywords = ["tdigest", "quantile", "percentile", "sketch", "subms"]
categories = ["algorithms", "data-structures", "science"]

[lib]
name = "subms_tdigest"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[features]
default = []
harness = ["dep:subms"]

[dependencies]
subms = { version = "0.5.2", path = "../../../../subms/rust", optional = true }
