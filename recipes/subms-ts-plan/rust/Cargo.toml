[package]
name = "subms-ts-plan"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <oss@submillisecond.com>"]
description = "submillisecond.com cookbook recipe - timeseries: subms-ts-plan. Compose per-recipe published p99 contracts into a system-level latency certificate. Byte-equivalent to com.submillisecond.recipes:subms-ts-plan."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://www.submillisecond.com/cookbook/recipes/subms-ts-plan"
repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-ts-plan"
documentation = "https://www.submillisecond.com/cookbook/recipes/subms-ts-plan"
keywords = ["latency", "query-plan", "certificate", "time-series", "subms"]
categories = ["data-structures", "algorithms"]

[lib]
name = "subms_ts_plan"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[features]
default = []
harness = ["dep:subms"]

[dependencies]
subms = { version = "0.5.2", path = "../../../../subms/rust", optional = true }
