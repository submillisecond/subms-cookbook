[package]
name = "subms-cuckoo-filter"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <knaier007@gmail.com>"]
description = "submillisecond.com cookbook recipe - data-structures: subms-cuckoo-filter. Bloom-alternative with delete support; partial-key cuckoo hashing."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://submillisecond.com/cookbook/recipes/subms-cuckoo-filter"
keywords = ["cuckoo", "filter", "probabilistic", "subms", "low-latency"]
categories = ["data-structures", "algorithms"]

[lib]
name = "subms_cuckoo_filter"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[features]
default = []
harness = ["dep:subms"]

[dependencies]
subms = { version = "0.3.0", optional = true }
