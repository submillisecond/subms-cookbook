[package]
name = "subms-cuckoo-filter"
version = "0.9.1"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <oss@submillisecond.com>"]
description = "submillisecond.com cookbook recipe - probabilistic: subms-cuckoo-filter. Bloom-alternative with delete support; partial-key cuckoo hashing."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://www.submillisecond.com/cookbook/recipes/subms-cuckoo-filter"
repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-cuckoo-filter"
keywords = ["cuckoo", "filter", "probabilistic", "subms", "low-latency"]
categories = ["data-structures", "algorithms"]

[lib]
name = "subms_cuckoo_filter"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[[example]]
name = "perf_features"
required-features = ["harness", "variable-fingerprint", "dynamic", "concurrent-reads", "compressed-buckets"]

[features]
default = []

# Bench-harness wiring: `Recipe` impl, perf_main example, sub-ms bench.
harness = ["dep:subms"]

# ----- Opt-in feature catalog (subms 0.5+) -----
# Each feature lives in src/features/<name>.rs behind a #[cfg(feature)]
# gate. Base cuckoo filter is zero-dep std-only with an 8-bit
# fingerprint; opt-ins add focused capability.
#
#   subms-cuckoo-filter = { version = "0.9.1", features = ["dynamic"] }
#   subms-cuckoo-filter = { version = "0.9.1", features = ["dynamic", "concurrent-reads"] }
#
# `variable-fingerprint` - VariableFpCuckooFilter: 8 / 12 / 16-bit
#                          fingerprint width. Wider = lower FPR but
#                          more memory.
# `dynamic`              - DynamicCuckooFilter: auto-grow when load
#                          factor passes a threshold. Doubles capacity
#                          and re-fingerprints in O(N).
# `concurrent-reads`     - CuckooSnapshot: immutable `Arc`-shareable
#                          snapshot for read-side fan-out while a
#                          writer keeps mutating the source filter.
# `compressed-buckets`   - CompressedCuckooFilter: sorted fingerprints
#                          per bucket + run-length tail encoding for
#                          empty slots. Lower memory; slower lookups.
variable-fingerprint = []
dynamic = []
concurrent-reads = []
compressed-buckets = []

# Every std-only capability module in one switch. Used by the coverage
# gate (`cargo tarpaulin --features full --lib`); excludes `harness` (pulls
# `subms`) and any external-dep feature.
full = ["variable-fingerprint", "dynamic", "concurrent-reads", "compressed-buckets"]

[dependencies]
subms = { version = "0.9.3", optional = true }
