[package]
name = "subms-ts-cbor"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <oss@submillisecond.com>"]
description = "submillisecond.com cookbook recipe - timeseries: subms-ts-cbor. Zero-dep CBOR TsCodec for TsSeries<f64> - compact columnar binary, byte-equivalent to com.submillisecond.recipes:subms-ts-cbor."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://www.submillisecond.com/cookbook/recipes/subms-ts-cbor"
repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-ts-cbor"
documentation = "https://www.submillisecond.com/cookbook/recipes/subms-ts-cbor"
keywords = ["cbor", "codec", "serialization", "time-series", "subms"]
categories = ["encoding", "data-structures"]

[lib]
name = "subms_ts_cbor"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[features]
default = []
harness = ["dep:subms"]

[dependencies]
subms-ts = { version = "0.6.0", path = "../../subms-ts/rust" }
subms = { version = "0.5.2", path = "../../../../subms/rust", optional = true }
