[package]
name = "subms-ts-sql"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <oss@submillisecond.com>"]
description = "submillisecond.com cookbook recipe - timeseries: subms-ts-sql. A zero-dep hand-rolled SQL-subset parser and executor that lowers SELECT/WHERE/GROUP BY/ORDER BY/LIMIT onto the typed TsDataFrame engine via subms-ts-lazy, subms-ts-expr, and subms-ts-groupby. Byte-equivalent to com.submillisecond.recipes:subms-ts-sql."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://www.submillisecond.com/cookbook/recipes/subms-ts-sql"
repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-ts-sql"
documentation = "https://www.submillisecond.com/cookbook/recipes/subms-ts-sql"
keywords = ["sql", "query", "dataframe", "time-series", "subms"]
categories = ["data-structures", "parser-implementations"]

[lib]
name = "subms_ts_sql"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[features]
default = []
harness = ["dep:subms"]

[dependencies]
subms-ts = { version = "0.6.0", path = "../../subms-ts/rust" }
subms-ts-expr = { version = "0.6.0", path = "../../subms-ts-expr/rust" }
subms-ts-lazy = { version = "0.6.0", path = "../../subms-ts-lazy/rust" }
subms-ts-groupby = { version = "0.6.0", path = "../../subms-ts-groupby/rust" }
subms = { version = "0.5.2", path = "../../../../subms/rust", optional = true }
