[package]
name = "subms-ts-adapter-arrow"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <oss@submillisecond.com>"]
description = "submillisecond.com cookbook recipe - timeseries: subms-ts-adapter-arrow. An Apache Arrow adapter - maps TsSeries / TsCollection to columnar RecordBatches and Arrow IPC streams for zero-copy-class handoff to Polars / DuckDB / pandas. Byte-equivalent to com.submillisecond.recipes:subms-ts-adapter-arrow."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://www.submillisecond.com/cookbook/recipes/subms-ts-adapter-arrow"
repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-ts-adapter-arrow"
documentation = "https://www.submillisecond.com/cookbook/recipes/subms-ts-adapter-arrow"
keywords = ["arrow", "columnar", "time-series", "ipc", "subms"]
categories = ["database", "encoding"]

[lib]
name = "subms_ts_arrow"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[features]
default = []
harness = ["dep:subms"]

[dependencies]
subms-ts = { version = "0.6.0", path = "../../subms-ts/rust" }
arrow = { version = "53", default-features = false, features = ["ipc"] }
subms = { version = "0.5.2", path = "../../../../subms/rust", optional = true }
