[package]
name = "subms-merge-iterator"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <knaier007@gmail.com>"]
description = "submillisecond.com cookbook recipe - storage: subms-merge-iterator. N-way merge of sorted streams via min-heap."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://submillisecond.com/cookbook/recipes/subms-merge-iterator"
keywords = ["merge", "sorted", "k-way", "subms"]
categories = ["data-structures", "algorithms"]

[lib]
name = "subms_merge_iterator"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[features]
default = []
harness = ["dep:subms"]

[dependencies]
subms = { version = "0.3.0", optional = true }
