[package]
name = "subms-zone-map"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <oss@submillisecond.com>"]
description = "submillisecond.com cookbook recipe - timeseries: subms-zone-map. Per-block min/max/count index for time + value predicate pushdown - skip blocks a query cannot touch. Byte-equivalent to com.submillisecond.recipes:subms-zone-map."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://www.submillisecond.com/cookbook/recipes/subms-zone-map"
repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-zone-map"
documentation = "https://www.submillisecond.com/cookbook/recipes/subms-zone-map"
keywords = ["zone-map", "predicate-pushdown", "time-series", "tsdb", "subms"]
categories = ["data-structures"]

[lib]
name = "subms_zone_map"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[features]
default = []
harness = ["dep:subms"]

[dependencies]
subms-ts = { version = "0.6.0", path = "../../subms-ts/rust" }
subms-gorilla-block = { version = "0.6.0", path = "../../subms-gorilla-block/rust" }
subms = { version = "0.5.2", path = "../../../../subms/rust", optional = true }
