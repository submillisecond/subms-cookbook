[package]
name = "subms-ts-aggregator"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <oss@submillisecond.com>"]
description = "submillisecond.com cookbook recipe - timeseries: subms-ts-aggregator. Streaming rolling-window aggregator (min/max/sum/mean/count) at O(1) amortised per push, mergeable across partitions. Byte-equivalent to com.submillisecond.recipes:subms-ts-aggregator."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://www.submillisecond.com/cookbook/recipes/subms-ts-aggregator"
repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-ts-aggregator"
documentation = "https://www.submillisecond.com/cookbook/recipes/subms-ts-aggregator"
keywords = ["rolling-window", "streaming", "aggregation", "time-series", "subms"]
categories = ["data-structures", "algorithms"]

[lib]
name = "subms_ts_aggregator"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[features]
default = []
harness = ["dep:subms"]

[dependencies]
subms-ts = { version = "0.6.0", path = "../../subms-ts/rust" }
subms = { version = "0.5.2", path = "../../../../subms/rust", optional = true }
