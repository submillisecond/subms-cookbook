[package]
name = "subms-ts-expr"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <oss@submillisecond.com>"]
description = "submillisecond.com cookbook recipe - timeseries: subms-ts-expr. A typed column-at-a-time expression IR evaluated over a heterogeneous TsDataFrame, producing a typed nullable TsArray. Byte-equivalent to com.submillisecond.recipes:subms-ts-expr."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://www.submillisecond.com/cookbook/recipes/subms-ts-expr"
repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-ts-expr"
documentation = "https://www.submillisecond.com/cookbook/recipes/subms-ts-expr"
keywords = ["expression", "dataframe", "time-series", "compute", "subms"]
categories = ["data-structures", "algorithms"]

[lib]
name = "subms_ts_expr"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[features]
default = []
harness = ["dep:subms"]

[dependencies]
subms-ts = { version = "0.6.0", path = "../../subms-ts/rust" }
subms = { version = "0.5.2", path = "../../../../subms/rust", optional = true }
