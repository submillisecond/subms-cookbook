[package]
name = "subms-ts-adapter-influxdb"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <oss@submillisecond.com>"]
description = "submillisecond.com cookbook recipe - timeseries: subms-ts-adapter-influxdb. A zero-dep InfluxDB v2 adapter - hand-rolled line-protocol encode + annotated-CSV decode over an injectable HTTP transport, mapping TsSeries / TsCollection to measurements. Byte-equivalent to com.submillisecond.recipes:subms-ts-adapter-influxdb."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://www.submillisecond.com/cookbook/recipes/subms-ts-adapter-influxdb"
repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-ts-adapter-influxdb"
documentation = "https://www.submillisecond.com/cookbook/recipes/subms-ts-adapter-influxdb"
keywords = ["influxdb", "line-protocol", "time-series", "flux", "subms"]
categories = ["database", "encoding"]

[lib]
name = "subms_ts_influxdb"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[features]
default = []
harness = ["dep:subms"]

[dependencies]
subms-ts = { version = "0.6.0", path = "../../subms-ts/rust" }
subms = { version = "0.5.2", path = "../../../../subms/rust", optional = true }
