[package]
name = "subms-arena-allocator"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <knaier007@gmail.com>"]
description = "submillisecond.com cookbook recipe - memory: subms-arena-allocator. Bump-pointer arena with chunked growth, alignment math, and reset() for per-request reuse."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://submillisecond.com/cookbook/recipes/subms-arena-allocator"
keywords = ["arena", "bump", "allocator", "memory", "subms"]
categories = ["memory-management", "no-std"]

[lib]
name = "subms_arena_allocator"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[features]
default = []
harness = ["dep:subms"]

[dependencies]
subms = { version = "0.2.2-rc1", optional = true }
