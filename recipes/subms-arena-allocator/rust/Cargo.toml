[package]
name = "subms-arena-allocator"
version = "0.9.1"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <oss@submillisecond.com>"]
description = "submillisecond.com cookbook recipe - memory: subms-arena-allocator. Fixed-capacity bump-pointer arena with reset() for per-request reuse."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://www.submillisecond.com/cookbook/recipes/subms-arena-allocator"
documentation = "https://www.submillisecond.com/cookbook/recipes/subms-arena-allocator"
repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-arena-allocator"
keywords = ["arena", "bump", "allocator", "memory", "subms"]
categories = ["memory-management", "no-std"]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "subms_arena_allocator"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness", "growable"]

[[example]]
name = "growth_main"
required-features = ["harness", "growable"]

[[example]]
name = "perf_features"
required-features = ["harness", "typed", "growable", "stats", "aligned"]

[features]
default = []

# The bench harness wiring: `Recipe` impl, `perf_main` example, and
# `sub_millisecond_bench` integration test. End users typically leave
# this off.
harness = ["dep:subms", "growable"]

# ----- Opt-in feature catalog (subms 0.5+) -----
# Each feature lives in src/features/<name>.rs behind a #[cfg(feature)]
# gate. Base Bump is a fixed-capacity bump arena; opt-ins layer focused
# capability without bloating the core build.
#
#   subms-arena-allocator = { version = "0.9.1", features = ["typed"] }
#   subms-arena-allocator = { version = "0.9.1", features = ["growable", "stats"] }
#
# `typed`     - TypedArena<T>: parametric over a single Copy type, with
#               slot reuse. `alloc` returns an opaque Slot handle,
#               `free(slot)` returns it to a LIFO free list, and the
#               next `alloc` takes it back before appending.
# `growable`  - GrowableBump: when the active chunk is exhausted,
#               allocate a new chunk (typically 2x previous). Base
#               returns None on OOM.
# `stats`     - StatsBump: live counters for allocations, bytes used,
#               bytes wasted to alignment padding, peak usage, chunk
#               count.
# `aligned`   - AlignedBump: explicit per-allocation alignment via
#               `alloc_aligned(size, align)`. Convenience over the
#               base's `alloc_raw(Layout)`.
typed = []
growable = []
stats = []
aligned = []

# Every std-only capability at once. Used by the coverage gate
# (`cargo tarpaulin --features full --lib`) so lib + all feature modules
# are measured together. Excludes `harness` (pulls the subms dep).
full = ["typed", "growable", "stats", "aligned"]

[dependencies]
subms = { version = "0.9.3", optional = true }
