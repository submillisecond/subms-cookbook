[package]
name = "subms-timer-wheel"
version = "0.5.2"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <oss@submillisecond.com>"]
description = "submillisecond.com cookbook recipe - concurrency: subms-timer-wheel. Single-level hashed timer wheel with O(1) schedule and cancel."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://www.submillisecond.com/cookbook/recipes/subms-timer-wheel"
repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-timer-wheel"
keywords = ["timer", "wheel", "scheduling", "subms"]
categories = ["concurrency", "data-structures"]

[lib]
name = "subms_timer_wheel"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[[example]]
name = "perf_features"
required-features = ["harness", "hierarchical", "concurrent", "deadline-scheduler", "cron", "metrics"]

[features]
default = []

# Bench-harness wiring: `Recipe` impl, perf_main example, sub-ms bench.
harness = ["dep:subms"]

# ----- Opt-in feature catalog (subms 0.5+) -----
# Each feature lives in src/features/<name>.rs behind a #[cfg(feature)]
# gate. Base wheel is std-only, single-threaded, delay-only. Each
# opt-in adds one focused capability:
#
#   subms-timer-wheel = { version = "0.5", features = ["hierarchical"] }
#
# `hierarchical`       - HierarchicalTimerWheel: cascade across a
#                        seconds / minutes / hours wheel. Handles
#                        deadlines years out without a million-slot
#                        wheel.
# `concurrent`         - ConcurrentTimerWheel: short-mutex wrapper that
#                        accepts schedules from any thread.
# `deadline-scheduler` - DeadlineScheduler: absolute-deadline API on
#                        top of the base wheel, with an injected clock
#                        for deterministic tests.
# `cron`               - CronSchedule + CronScheduler: minimum-viable
#                        5-field cron parser (* */N a,b a-b ranges) and
#                        a scheduler that re-arms on each fire.
# `metrics`            - MeteredTimerWheel: per-instance counters
#                        (scheduled / fired / cancelled / ticks /
#                        cascades).
hierarchical = []
concurrent = []
deadline-scheduler = []
cron = []
metrics = []

[dependencies]
subms = { version = "0.5.2", path = "../../../../subms/rust", optional = true }
