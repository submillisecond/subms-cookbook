[package]
name = "subms-ts-reshape"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <oss@submillisecond.com>"]
description = "submillisecond.com cookbook recipe - timeseries: subms-ts-reshape. Frame reshaping over a heterogeneous TsDataFrame: long-to-wide pivot on string categories, wide-to-long melt / unpivot with a real Str variable column, list-cell explode, vstack / hstack concatenation, and row set-ops (union / intersect / except), with Arrow-style validity for absent cells. Byte-equivalent to com.submillisecond.recipes:subms-ts-reshape."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://www.submillisecond.com/cookbook/recipes/subms-ts-reshape"
repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-ts-reshape"
documentation = "https://www.submillisecond.com/cookbook/recipes/subms-ts-reshape"
keywords = ["pivot", "reshape", "dataframe", "concat", "subms"]
categories = ["data-structures", "algorithms"]

[lib]
name = "subms_ts_reshape"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[features]
default = []
harness = ["dep:subms"]

[dependencies]
subms-ts = { version = "0.6.0", path = "../../subms-ts/rust" }
subms-ts-expr = { version = "0.6.0", path = "../../subms-ts-expr/rust" }
subms = { version = "0.5.2", path = "../../../../subms/rust", optional = true }
