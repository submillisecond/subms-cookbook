[package]
name = "subms-ts-cardinality"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <oss@submillisecond.com>"]
description = "submillisecond.com cookbook recipe - timeseries: subms-ts-cardinality. Series-count caps, per-tenant cardinality limits, and idempotent-ingest dedup guarding a TsCollection. Byte-equivalent to com.submillisecond.recipes:subms-ts-cardinality."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://www.submillisecond.com/cookbook/recipes/subms-ts-cardinality"
repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-ts-cardinality"
documentation = "https://www.submillisecond.com/cookbook/recipes/subms-ts-cardinality"
keywords = ["cardinality", "multi-tenancy", "idempotency", "time-series", "subms"]
categories = ["data-structures", "algorithms"]

[lib]
name = "subms_ts_cardinality"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[features]
default = []
harness = ["dep:subms"]

[dependencies]
subms-ts = { version = "0.6.0", path = "../../subms-ts/rust" }
subms = { version = "0.5.2", path = "../../../../subms/rust", optional = true }
