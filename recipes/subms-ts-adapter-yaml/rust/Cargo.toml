[package]
name = "subms-ts-adapter-yaml"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <oss@submillisecond.com>"]
description = "submillisecond.com cookbook recipe - adapter: subms-ts-adapter-yaml. Human-readable YAML TsCodec for TsSeries<f64>, built on the saphyr YAML 1.2 parser."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://www.submillisecond.com/cookbook/recipes/subms-ts-adapter-yaml"
repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-ts-adapter-yaml"
documentation = "https://www.submillisecond.com/cookbook/recipes/subms-ts-adapter-yaml"
keywords = ["yaml", "codec", "serialization", "time-series", "subms"]
categories = ["encoding", "data-structures"]

[lib]
name = "subms_ts_yaml"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[features]
default = []
harness = ["dep:subms"]

[dependencies]
subms-ts = { version = "0.6.0", path = "../../subms-ts/rust" }
saphyr = "0.0.6"
subms = { version = "0.5.2", path = "../../../../subms/rust", optional = true }
