[package]
name = "subms-ts-fill"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <oss@submillisecond.com>"]
description = "submillisecond.com cookbook recipe - timeseries: subms-ts-fill. Gap fill for time series - linear interpolation, last-observation-carried-forward, and zero fill on a regular step. Byte-equivalent to com.submillisecond.recipes:subms-ts-fill."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://www.submillisecond.com/cookbook/recipes/subms-ts-fill"
repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-ts-fill"
documentation = "https://www.submillisecond.com/cookbook/recipes/subms-ts-fill"
keywords = ["gap-fill", "interpolation", "locf", "time-series", "subms"]
categories = ["algorithms", "data-structures"]

[lib]
name = "subms_ts_fill"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[features]
default = []
harness = ["dep:subms"]

[dependencies]
subms-ts = { version = "0.6.0", path = "../../subms-ts/rust" }
subms = { version = "0.5.2", path = "../../../../subms/rust", optional = true }
