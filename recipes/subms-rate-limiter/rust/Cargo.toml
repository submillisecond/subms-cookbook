[package]
name = "subms-rate-limiter"
version = "0.8.2"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <oss@submillisecond.com>"]
description = "submillisecond.com cookbook recipe - concurrency: subms-rate-limiter. Lock-free GCRA-style rate limiter with a single-atomic CAS-loop."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://www.submillisecond.com/cookbook/recipes/subms-rate-limiter"
repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-rate-limiter"
keywords = ["rate-limit", "gcra", "lock-free", "subms", "low-latency"]
categories = ["concurrency", "algorithms"]

[lib]
name = "subms_rate_limiter"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[[example]]
name = "growth_main"
required-features = ["harness"]

[[example]]
name = "perf_features"
required-features = ["harness", "token-bucket", "hierarchical", "distributed-backend", "metrics"]

[features]
default = []
harness = ["dep:subms"]

# ----- Opt-in feature catalog (subms 0.5+) -----
# Each feature lives in src/features/<name>.rs behind a #[cfg(feature)]
# gate. Base limiter is a GCRA / leaky-bucket model (smooth outflow);
# opt-ins below add other shapes + cross-process glue + observability.
#
#   subms-rate-limiter = { version = "0.8.2", features = ["token-bucket"] }
#
# `token-bucket`        - Classic token bucket: capacity C, refill rate R.
#                         `try_acquire(n)` succeeds when bucket >= n.
#                         Different shape from the base leaky-bucket /
#                         GCRA model: tokens accumulate up to capacity,
#                         caller drains them in batches.
# `hierarchical`        - Nested limiters: a parent limiter caps a shared
#                         budget across N child limiters. `try_acquire`
#                         succeeds only when parent AND child both grant.
# `distributed-backend` - Pluggable `Backend` trait for cross-process
#                         state (Redis-style atomic INCR + EXPIRE). Ships
#                         an `InMemoryBackend`; real distributed backends
#                         are downstream user concerns.
# `metrics`             - Per-instance counters: acquires (granted /
#                         rejected), refill events, current tokens.
token-bucket = []
hierarchical = ["token-bucket"]
distributed-backend = []
metrics = ["token-bucket"]

# Convenience aggregate: every std-only capability module in one flag.
# The coverage gate builds with `--features full`, so this is the union
# of all opt-in modules (excludes `harness`, which pulls the dev-only
# `subms` bench dep).
full = ["token-bucket", "hierarchical", "distributed-backend", "metrics"]

[dependencies]
subms = { version = "0.8.2", optional = true }
