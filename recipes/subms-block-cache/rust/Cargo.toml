[package]
name = "subms-block-cache"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <oss@submillisecond.com>"]
description = "submillisecond.com cookbook recipe - memory: subms-block-cache. Clock-sweep block cache with constant-time eviction."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://www.submillisecond.com/cookbook/recipes/subms-block-cache"
repository = "https://github.com/submillisecond/subms-cookbook/tree/main/recipes/subms-block-cache"
keywords = ["cache", "lru", "clock-sweep", "subms", "low-latency"]
categories = ["caching", "data-structures"]

[lib]
name = "subms_block_cache"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[[example]]
name = "growth_main"
required-features = ["harness"]

[[example]]
name = "perf_features"
required-features = ["harness", "arc", "tinylfu", "weighted", "concurrent-shards", "metrics"]

[features]
default = []

# Bench-harness wiring: `Recipe` impl, perf_main example, sub-ms bench.
harness = ["dep:subms"]

# ----- Opt-in feature catalog (subms 0.5+) -----
# Each feature lives in src/features/<name>.rs behind a #[cfg(feature)]
# gate. Base block cache is the clock-sweep variant (second-chance LRU
# with constant-time eviction). Each opt-in adds a focused capability
# without bloating the core build. Pick what you need:
#
#   subms-block-cache = { version = "0.5", features = ["arc"] }
#   subms-block-cache = { version = "0.5", features = ["tinylfu", "metrics"] }
#
# `arc`               - Adaptive Replacement Cache: two LRU lists (recent
#                       + frequent) with adaptive sizing between them,
#                       plus two ghost lists. Scan-resistant.
# `tinylfu`           - W-TinyLFU admission policy: each candidate
#                       eviction goes through a count-min-sketch
#                       admission filter. Self-contained CMS impl;
#                       does NOT depend on subms-count-min-sketch
#                       (avoids cyclic refresh + keeps cache leaf-dep).
# `weighted`          - Per-entry size: caller provides a
#                       `size_of(value)` callback. Cache evicts to keep
#                       total bytes <= capacity. Base assumes uniform.
# `concurrent-shards` - Sharded cache: split keyspace into N independent
#                       shards by hash(key) % N. Each shard has its own
#                       lock; readers/writers on different shards don't
#                       contend.
# `metrics`           - Per-instance counters: hits, misses, evictions,
#                       admissions, shard-contention events.
arc = []
tinylfu = []
weighted = []
concurrent-shards = []
metrics = []

[dependencies]
subms = { version = "0.8.0", path = "../../../../subms/rust", optional = true }
