[package]
name = "subms-block-cache"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kieran Smith <knaier007@gmail.com>"]
description = "submillisecond.com cookbook recipe - memory: subms-block-cache. Clock-sweep block cache with constant-time eviction."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://submillisecond.com/cookbook/recipes/subms-block-cache"
keywords = ["cache", "lru", "clock-sweep", "subms", "low-latency"]
categories = ["caching", "data-structures"]

[lib]
name = "subms_block_cache"
path = "src/lib.rs"

[[example]]
name = "perf_main"
required-features = ["harness"]

[features]
default = []
harness = ["dep:subms"]

[dependencies]
subms = { version = "0.2.2-rc1", optional = true }
