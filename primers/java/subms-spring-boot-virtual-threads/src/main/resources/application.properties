# The single flag that opts a Spring Boot 4 app into virtual threads.
# Under this setting the Tomcat connector hands every accepted request to
# a fresh virtual thread instead of a pool of platform threads, and
# @Async / TaskExecutor beans use Executors.newVirtualThreadPerTaskExecutor.
#
# Flip to `false` to run the same workload through Tomcat's default
# platform-thread pool and compare. The LoadDriver reads the resulting
# numbers from /actuator-like health and prints percentiles.
spring.threads.virtual.enabled=true

# Keep server bookkeeping minimal so we measure the application code, not
# logging plumbing.
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.com.submillisecond=INFO

# 8080 is the default; surface it so the LoadDriver can hit a known port.
server.port=8080

# Tomcat thread settings - useful as a sanity contrast when virtual
# threads are off. With virtual threads on these are effectively ignored
# (Tomcat schedules each accept on a new virtual thread).
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
